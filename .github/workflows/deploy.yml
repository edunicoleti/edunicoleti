name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  # Porta de qualidade: lint + checagem de tipos. Se falhar, o deploy nem começa.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Injetadas no build para o /financeiro sincronizar via Supabase.
          # Se os secrets não existirem, resolvem para vazio e o app roda em
          # modo local (localStorage) — sem quebrar o deploy.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Tags fixas, nunca @master: essas actions recebem a chave SSH de
      # producao, e um branch movel deixaria commits de terceiros entrarem
      # no deploy sem revisao.
      - name: Upload files via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "~/deploy_temp"
          strip_components: 1

      - name: Sync to web root via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            TARGET=~/domains/edunicoleti.com.br/public_html

            if [ ! -d "$TARGET" ]; then
              echo "ERRO: diretorio alvo nao encontrado: $TARGET"
              exit 1
            fi

            rsync -av --delete ~/deploy_temp/ "$TARGET"/
            rm -rf ~/deploy_temp
            echo "Deploy concluido em: $TARGET"
