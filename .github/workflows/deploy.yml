name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Diagnose server paths
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== HOME ==="
            echo $HOME
            echo "=== ls -la ~ ==="
            ls -la ~
            echo "=== ls -la ~/public_html ==="
            ls -la ~/public_html || echo "public_html nao encontrado"
            echo "=== ls -la ~/public_html/assets ==="
            ls -la ~/public_html/assets || echo "assets nao encontrado"
