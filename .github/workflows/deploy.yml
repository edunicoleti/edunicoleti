name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "~/deploy_temp"
          strip_components: 1

      - name: Sync to correct web root via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            WEBROOT=$(ls -d ~/domains/*/public_html 2>/dev/null | head -1)
            if [ -z "$WEBROOT" ]; then
              WEBROOT=~/public_html
            fi
            echo "Deploying to: $WEBROOT"
            rsync -av --delete ~/deploy_temp/ "$WEBROOT"/
            rm -rf ~/deploy_temp
            echo "Done. Files in $WEBROOT:"
            ls -la "$WEBROOT"
